apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gateway-fabric
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: infrastructure
  source:
    repoURL: oci://ghcr.io/nginx/charts/nginx-gateway-fabric
    # 無関係な Route のパス重複で Policy が拒否される不具合（NGF #4890）の修正版。
    targetRevision: 2.8.0
    chart: nginx-gateway-fabric
    helm:
      values: |
        nginxGateway:
          priorityClassName: homelab-platform
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        nginx:
          # data plane の resources は nginx.container 配下。nginx.resources は chart が読まない。
          container:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 1000m
                memory: 512Mi
          service:
            type: LoadBalancer
            loadBalancerIP: 192.168.122.100
            externalTrafficPolicy: Local
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
