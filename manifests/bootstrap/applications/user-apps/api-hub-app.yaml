apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-hub
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  project: apps
  source:
    repoURL: https://github.com/home-lab-ksera/home-lab-k8s.git
    targetRevision: HEAD
    path: manifests/apps/api-hub
  destination:
    server: https://kubernetes.default.svc
    namespace: sandbox
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
