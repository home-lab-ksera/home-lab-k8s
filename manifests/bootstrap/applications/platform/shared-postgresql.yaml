apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-postgresql
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  source:
    repoURL: https://github.com/home-lab-ksera/home-lab-k8s.git
    targetRevision: HEAD
    path: manifests/platform/shared-postgresql
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  # Reloader がサーバー証明書の更新時に Pod template へ書く annotation を差分にしない。
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
