# api-hub内部公開用HTTPRoute（HTTP→HTTPSリダイレクト）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-hub-internal-redirect
  namespace: sandbox
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nginx-gateway
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - api-hub.internal.qroksera.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /

---
# api-hub内部公開用HTTPRoute（HTTPS）
# api-hub に利用者認証はない。Gateway には dashboard（ブラウザー）が使う読み取り経路だけを通し、
# 更新・削除・Slack・通知の API はクラスタ内の Service (api-hub.sandbox.svc:3000) 専用にする。
# 経路を追加するときは api-hub の is_browser_path と合わせて確認する。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-hub-internal
  namespace: sandbox
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https-internal
  hostnames:
    - api-hub.internal.qroksera.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /health
        - path:
            type: Exact
            value: /s3/list_objects_v2
        - path:
            type: Exact
            value: /s3/browser_get_object
        - path:
            type: Exact
            value: /s3/browser_open
        - path:
            type: PathPrefix
            value: /s3/preview/
      backendRefs:
        - group: ""
          kind: Service
          name: api-hub
          port: 3000
          weight: 1
