apiVersion: gateway.nginx.org/v1alpha1
kind: AccessPolicy
metadata:
  name: nature-remo-internal
  namespace: sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: nature-remo-dashboard
  action: Allow
  rules:
    - name: home-lan
      source:
        type: IPAddress
        ipAddress:
          address: 192.168.10.0/24
    - name: cluster-nodes
      source:
        type: IPAddress
        ipAddress:
          address: 192.168.122.0/24
    - name: cluster-pods-and-subnet-router
      source:
        type: IPAddress
        ipAddress:
          address: 10.244.0.0/16
    - name: tailnet
      source:
        type: IPAddress
        ipAddress:
          address: 100.64.0.0/10
---
# dashboard のリモコン画面から使う API。dashboard と同じ Origin になるよう、dashboard のホスト名で受ける。
# /remo/api/ を nature-remo の /api/ に書き換える。送信元の制限（AccessPolicy）は上と同じ。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nature-remo-dashboard
  namespace: sandbox
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https-internal
  hostnames:
    - dashboard.internal.qroksera.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /remo/api/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/
      backendRefs:
        - group: ""
          kind: Service
          name: nature-remo
          port: 80
          weight: 1
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nature-remo
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      app: nature-remo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: nginx-gateway
      ports:
        - protocol: TCP
          port: 8080
  # Nature Remo mini 1 の Local API。DNS は core の allow-dns が許可。
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.10.2/32
      ports:
        - protocol: TCP
          port: 80
