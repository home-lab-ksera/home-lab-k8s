apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-camera-spool
  namespace: sandbox
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: nfs-external
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: home-camera
  namespace: sandbox
spec:
  clusterIP: None
  selector:
    app: home-camera-recorder
  ports:
  - name: metrics
    port: 9090
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: home-camera
  namespace: sandbox
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  serviceName: home-camera
  selector:
    matchLabels:
      app: home-camera-recorder
  template:
    metadata:
      labels:
        app: home-camera-recorder
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: recorder
        image: harbor.internal.qroksera.com/sandbox/home-camera:latest
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/home-camera
        args:
        - --record
        env:
        - name: API_HUB_BASE_URL
          value: http://api-hub.sandbox.svc:3000
        - name: SPOOL_DIR
          value: /spool
        - name: CAMERA_ID
          value: camera
        - name: FFMPEG_VIDEO_CODEC
          value: copy
        - name: FFMPEG_AUDIO_CODEC
          value: copy
        - name: FFMPEG_AUDIO_BITRATE
          value: 128k
        - name: FFMPEG_PRESET
          value: veryfast
        - name: FFMPEG_CRF
          value: '23'
        - name: RTSP_URL
          valueFrom:
            secretKeyRef:
              name: home-camera
              key: RTSP_URL
        - name: SEGMENT_SECONDS
          value: '3600'
        - name: SPOOL_MAX_BYTES
          value: '85899345920'
        # 7日間の実測: メモリ最大 451Mi（上限 512Mi に近かった）、CPU p99 15m。
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: spool
          mountPath: /spool
        ports:
        - name: metrics
          containerPort: 9090
        startupProbe:
          httpGet:
            path: /health
            port: 9090
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
          periodSeconds: 15
          failureThreshold: 4
      - name: uploader
        image: harbor.internal.qroksera.com/sandbox/home-camera:latest
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/home-camera
        args:
        - --upload
        env:
        - name: API_HUB_BASE_URL
          value: http://api-hub.sandbox.svc:3000
        - name: SPOOL_DIR
          value: /spool
        - name: CAMERA_ID
          value: camera
        - name: FFMPEG_VIDEO_CODEC
          value: copy
        - name: FFMPEG_AUDIO_CODEC
          value: copy
        - name: FFMPEG_AUDIO_BITRATE
          value: 128k
        - name: FFMPEG_PRESET
          value: veryfast
        - name: FFMPEG_CRF
          value: '23'
        # 7日間の実測: メモリ最大 7Mi、CPU p99 10m。
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: spool
          mountPath: /spool
      volumes:
      - name: spool
        persistentVolumeClaim:
          claimName: home-camera-spool
      terminationGracePeriodSeconds: 45
---
# 前の晩に動きがあった区間を、文字だけで Slack に送る（画像は送らない）。
# 最後の録画（〜09:00）の解析が uploader で終わるのを待って 09:30 に動かす。
# 同じ晩の通知は api-hub の通知キューで1件にまとまるので、手で再実行しても二重には送られない。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: home-camera-summary
  namespace: sandbox
spec:
  schedule: 30 9 * * *
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 失敗した Job が古い image digest を持ったまま残ると、Image Updater が更新を繰り返し試みる。
      # 1日で消す（ログは Loki に残る）。
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: home-camera-summary
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          imagePullSecrets:
          - name: harbor-registry
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: summary
            image: harbor.internal.qroksera.com/sandbox/home-camera:latest
            imagePullPolicy: IfNotPresent
            command:
            - /usr/local/bin/home-camera
            args:
            - --summary
            env:
            - name: API_HUB_BASE_URL
              value: http://api-hub.sandbox.svc:3000
            - name: CAMERA_ID
              value: camera
            - name: SLACK_CHANNEL
              value: C0840EGHDS9
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 200m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
