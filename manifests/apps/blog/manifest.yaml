apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
  namespace: sandbox
  labels:
    app: blog
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      restartPolicy: Always
      # 非 root のコンテナが 80 番で待ち受けられるようにする（safe sysctl）。
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: blog
          image: harbor.qroksera.com/sandbox/blog:0.0.1
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # nginx の pid と一時ファイルの置き場。
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 128Mi
              ephemeral-storage: 512Mi
          ports:
            - containerPort: 80
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
# blog用Service
apiVersion: v1
kind: Service
metadata:
  name: blog
  namespace: sandbox
  labels:
    app: blog
spec:
  selector:
    app: blog
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
