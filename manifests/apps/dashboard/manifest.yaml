apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: sandbox
  labels:
    app: dashboard
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      restartPolicy: Always
      # 非 root のコンテナが 80 番で待ち受けられるようにする（safe sysctl）。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: dashboard
          image: harbor.internal.qroksera.com/sandbox/dashboard:latest
          imagePullPolicy: IfNotPresent
          # 起動時に config.js を書くため rootfs は読み取り専用にしない。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 128Mi
              ephemeral-storage: 512Mi
          ports:
            - containerPort: 80
          env:
            - name: WRAPPER_API_BASE_URL
              value: "https://api-hub.internal.qroksera.com"
            - name: S3_BUCKET
              value: "pdfs"
            - name: S3_PREFIX
              value: "hitomi"
            - name: MEDIA_CATALOG
              value: "true"
            - name: DIRECT_MEDIA_DELIVERY
              value: "true"

---
# dashboard用Service（内部公開のみ）
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: sandbox
  labels:
    app: dashboard
spec:
  selector:
    app: dashboard
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
