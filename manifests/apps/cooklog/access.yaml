# dashboard のレシピ画面から使う API。dashboard と同じ Origin になるよう、dashboard のホスト名で受ける。
# /cook/api/ を cooklog の /api/ に書き換える。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cooklog-dashboard
  namespace: sandbox
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https-internal
  hostnames:
    - dashboard.internal.qroksera.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /cook/api/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/
      backendRefs:
        - group: ""
          kind: Service
          name: cooklog
          port: 3000
          weight: 1
