# control plane は Kubernetes API を監視し、data plane へ設定を gRPC（8443）で配る。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane
  namespace: nginx-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx-gateway-fabric
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-gateway-nginx
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: victoria-metrics
      ports:
        - protocol: TCP
          port: 9113
  egress:
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 192.168.122.10/32
      ports:
        - protocol: TCP
          port: 6443
---
# data plane は利用者（LAN、Tailnet、ノードの containerd、クラスタ内の Pod）から 80 / 443 を受ける。
# 送信は control plane と、HTTPRoute の backend の namespace・port だけ。backend 側の ingress で Pod を絞る。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-data-plane
  namespace: nginx-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx-gateway-nginx
      gateway.networking.k8s.io/gateway-name: nginx-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: victoria-metrics
      ports:
        - protocol: TCP
          port: 9113
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-gateway-fabric
      ports:
        - protocol: TCP
          port: 8443
    # blog / cooklog / viewer 80、rsshub 1200、api-hub / media-api 3000、nature-remo 8080。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandbox
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 1200
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8080
    # Harbor core / portal と ArgoCD server。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
      ports:
        - protocol: TCP
          port: 8080
    # Grafana と VMUI。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8428
    # RustFS の S3（9000）と console（9001）。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rustfs
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
---
