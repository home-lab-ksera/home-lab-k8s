apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # ArgoCD URL設定
  url: https://argocd.internal.qroksera.com

  # admin アカウントで API トークン発行を許可
  accounts.admin: apiKey, login

  # Git・クラスタ差分の定期確認間隔（既定は約3分）。controller の CPU を下げるため延ばす。
  # Git webhook は未設定のため、Image Updater の書き戻しから配布開始までも最大この間隔待つ。
  # 環境変数で読み込むため、変更後は application-controller と repo-server の再起動が必要。
  timeout.reconciliation: 300s

  # OCI Helmレジストリの利用を有効化
  helm.oci.enabled: "true"

  # repo-local wrapper で helmCharts を render する
  kustomize.buildOptions: --enable-helm

  # GitHub OAuth設定（Dex）
  dex.config: |
    connectors:
    - type: github
      id: github
      name: GitHub
      config:
        clientId: Ov23li8T6IFuiuLcoSJa
        clientSecret: $dex.github.clientSecret
        redirectURI: https://argocd.internal.qroksera.com/api/dex/callback

  # 既存のリソース除外設定
  resource.exclusions: |
    ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
    - apiGroups:
      - ''
      - discovery.k8s.io
      kinds:
      - Endpoints
      - EndpointSlice
    ### Internal Kubernetes resources excluded reduce the number of watched events
    - apiGroups:
      - coordination.k8s.io
      kinds:
      - Lease
    ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
    - apiGroups:
      - authentication.k8s.io
      - authorization.k8s.io
      kinds:
      - SelfSubjectReview
      - TokenReview
      - LocalSubjectAccessReview
      - SelfSubjectAccessReview
      - SelfSubjectRulesReview
      - SubjectAccessReview
    ### Intermediate Certificate Request excluded reduce the number of watched events
    - apiGroups:
      - certificates.k8s.io
      kinds:
      - CertificateSigningRequest
    - apiGroups:
      - cert-manager.io
      kinds:
      - CertificateRequest
    ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest

  # 既存のリソースカスタマイズ設定
  resource.customizations.ignoreResourceUpdates.ConfigMap: |
    jqPathExpressions:
      # Ignore the cluster-autoscaler status
      - '.metadata.annotations."cluster-autoscaler.kubernetes.io/last-updated"'
      # Ignore the annotation of the legacy Leases election
      - '.metadata.annotations."control-plane.alpha.kubernetes.io/leader"'
  resource.customizations.ignoreResourceUpdates.Endpoints: |
    jsonPointers:
      - /metadata
      - /subsets
  resource.customizations.ignoreResourceUpdates.all: |
    jsonPointers:
      - /status
  resource.customizations.ignoreResourceUpdates.apps_ReplicaSet: |
    jqPathExpressions:
      - '.metadata.annotations."deployment.kubernetes.io/desired-replicas"'
      - '.metadata.annotations."deployment.kubernetes.io/max-replicas"'
      - '.metadata.annotations."rollout.argoproj.io/desired-replicas"'
  resource.customizations.ignoreResourceUpdates.argoproj.io_Application: |
    jqPathExpressions:
      - '.metadata.annotations."notified.notifications.argoproj.io"'
      - '.metadata.annotations."argocd.argoproj.io/refresh"'
      - '.metadata.annotations."argocd.argoproj.io/hydrate"'
      - '.operation'
  resource.customizations.ignoreResourceUpdates.argoproj.io_Rollout: |
    jqPathExpressions:
      - '.metadata.annotations."notified.notifications.argoproj.io"'
  resource.customizations.ignoreResourceUpdates.autoscaling_HorizontalPodAutoscaler: |
    jqPathExpressions:
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/behavior"'
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/conditions"'
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/metrics"'
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/current-metrics"'
  resource.customizations.ignoreResourceUpdates.discovery.k8s.io_EndpointSlice: |
    jsonPointers:
      - /metadata
      - /endpoints
      - /ports
  # CronJob の実行成否は Job/ログで確認し、GitOps の Application health では desired state の存在を評価する。
  # suspend は宣言された停止状態。Progressing にすると段階移行の PostSync が開始できない。
  resource.customizations.health.batch_CronJob: |
    hs = {}
    if obj.spec ~= nil and obj.spec.suspend == true then
      hs.status = "Healthy"
      hs.message = "CronJob is configured with scheduling suspended"
      return hs
    end
    hs.status = "Healthy"
    hs.message = "CronJob is configured"
    return hs
  # CR 作成だけでは DB を Healthy とせず、instance とバックアップの準備を待つ。
  resource.customizations.health.postgres-operator.crunchydata.com_PostgresCluster: |
    local hs = {status = "Progressing", message = "Waiting for PostgreSQL and backup readiness"}
    if obj.status == nil or obj.status.observedGeneration ~= obj.metadata.generation then
      return hs
    end
    local desired, ready = 0, 0
    for _, instance in ipairs(obj.spec.instances or {}) do
      desired = desired + (instance.replicas or 1)
    end
    for _, instance in ipairs(obj.status.instances or {}) do
      ready = ready + (instance.readyReplicas or 0)
    end
    local backupReady = false
    for _, condition in ipairs(obj.status.conditions or {}) do
      if condition.type == "PGBackRestReplicaCreate" and condition.status == "True" then
        backupReady = true
      end
    end
    if desired > 0 and ready >= desired and backupReady then
      hs.status = "Healthy"
      hs.message = "PostgreSQL instances and backup repository are ready"
    end
    return hs
  # ExternalSecret を ArgoCD 上で正しくヘルス判定する
  resource.customizations.health.external-secrets.io_ExternalSecret: |
    hs = {}
    if obj.status ~= nil and obj.status.conditions ~= nil then
      for _, condition in ipairs(obj.status.conditions) do
        if condition.type == "Ready" then
          if condition.status == "True" then
            hs.status = "Healthy"
            hs.message = condition.message or "ExternalSecret is ready"
            return hs
          end
          if condition.status == "False" then
            hs.status = "Degraded"
            hs.message = condition.message or "ExternalSecret is not ready"
            return hs
          end
        end
      end
    end
    hs.status = "Progressing"
    hs.message = "Waiting for ExternalSecret readiness"
    return hs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  # GitHubユーザーID（99033723 = ksera631@gmail.com）に完全な管理者権限を付与
  policy.csv: |
    # GitHubユーザーID（99033723 = ksera631@gmail.com）に完全な管理者権限を付与
    g, 99033723, role:admin

    # 明示的なアクション権限を追加
    p, role:admin, applications, *, */*, allow
    p, role:admin, clusters, *, *, allow
    p, role:admin, repositories, *, *, allow
    p, role:admin, certificates, *, *, allow
    p, role:admin, accounts, *, *, allow
    p, role:admin, gpgkeys, *, *, allow
    p, role:admin, logs, get, *, allow
    p, role:admin, exec, create, */*, allow

    # リソースアクション権限（restart等）
    p, role:admin, applications, action/*, */*, allow
    p, role:admin, applications, action/apps/Deployment/restart, */*, allow
    p, role:admin, applications, action/apps/ReplicaSet/restart, */*, allow
    p, role:admin, applications, action/apps/DaemonSet/restart, */*, allow
    p, role:admin, applications, action/apps/StatefulSet/restart, */*, allow
  # 管理者以外はログイン不可（デフォルト権限なし）
  policy.default: ""
---
# ArgoCD Secret with GitHub OAuth Client ID (permanent)
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-secret
    app.kubernetes.io/part-of: argocd
  annotations:
    # External Secretとの競合を避けるためのアノテーション
    argocd.argoproj.io/sync-options: "Merge"
type: Opaque
stringData:
  # GitHub OAuth Client ID (固定値)
  dex.github.clientId: "Ov23li8T6IFuiuLcoSJa"
  # dex.github.clientSecret は External Secret から動的に注入される
