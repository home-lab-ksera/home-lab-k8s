apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: core
  namespace: argocd
spec:
  description: コア基盤（Namespace/StorageClass/NetworkPolicy）
  sourceRepos:
    - https://github.com/home-lab-ksera/home-lab-k8s.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: storage.k8s.io
      kind: StorageClass
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
spec:
  description: クラスタ基盤（Networking/Ingress/Cert/Storage）
  sourceRepos:
    - https://github.com/home-lab-ksera/home-lab-k8s.git
    - https://metallb.github.io/metallb
    - oci://ghcr.io/nginx/charts/nginx-gateway-fabric
    - https://charts.jetstack.io
    - https://pkgs.tailscale.com/helmcharts
    - https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: nginx-gateway
    - server: https://kubernetes.default.svc
      namespace: metallb-system
    - server: https://kubernetes.default.svc
      namespace: local-path-storage
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: tailscale
    - server: https://kubernetes.default.svc
      namespace: nfs-storage
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: 運用基盤（ArgoCD/ESO/Harbor/RustFS/CI）
  sourceRepos:
    - https://github.com/home-lab-ksera/home-lab-k8s.git
    - https://charts.external-secrets.io
    - https://argoproj.github.io/argo-helm
    - ghcr.io/actions/actions-runner-controller-charts
    - oci://ghcr.io/actions/actions-runner-controller-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: external-secrets-system
    - server: https://kubernetes.default.svc
      namespace: arc-systems
    - server: https://kubernetes.default.svc
      namespace: arc-runners
    - server: https://kubernetes.default.svc
      namespace: harbor
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: rustfs
    - server: https://kubernetes.default.svc
      namespace: database
    - server: https://kubernetes.default.svc
      namespace: postgres-operator
    - server: https://kubernetes.default.svc
      namespace: sandbox
    - server: https://kubernetes.default.svc
      namespace: default
    - server: https://kubernetes.default.svc
      namespace: tailscale
    - server: https://kubernetes.default.svc
      namespace: observability
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: access
  namespace: argocd
spec:
  description: 公開/接続系（Gateway/DNS/HTTPRoute）
  sourceRepos:
    - https://github.com/home-lab-ksera/home-lab-k8s.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: harbor
    - server: https://kubernetes.default.svc
      namespace: rustfs
    - server: https://kubernetes.default.svc
      namespace: sandbox
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: nginx-gateway
    - server: https://kubernetes.default.svc
      namespace: tailscale
    - server: https://kubernetes.default.svc
      namespace: observability
  clusterResourceWhitelist: []
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.slack-webhook: ""
    notifications.argoproj.io/subscribe.on-sync-failed.slack-webhook: ""
spec:
  description: ユーザーアプリ
  sourceRepos:
    - https://github.com/home-lab-ksera/home-lab-k8s.git
    - https://charts.bitnami.com/bitnami
  destinations:
    - server: https://kubernetes.default.svc
      namespace: database
    - server: https://kubernetes.default.svc
      namespace: sandbox
    - server: https://kubernetes.default.svc
      namespace: tools
  clusterResourceWhitelist: []
