[server]
root_url = https://grafana.internal.qroksera.com
[auth.anonymous]
enabled = false
[users]
allow_sign_up = false
[security]
cookie_secure = true
cookie_samesite = lax
[analytics]
reporting_enabled = false
check_for_updates = false
[plugins]
# 同梱プラグインはイメージ更新で管理する。起動時更新は読み取り専用 FS で失敗し、登録が失われる。
preinstall_auto_update = false
[log]
mode = console
[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/home-lab.json
