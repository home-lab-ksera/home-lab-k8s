groups:
  - name: home-lab-meta
    interval: 30s
    rules:
      # デッドマンスイッチ。常に発火し、Alertmanager の heartbeat receiver だけが受け取る。
      # 外部（healthchecks.io）で受信が途絶えたら、監視経路・クラスタ・ホスト・回線のいずれかの停止を意味する。
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "監視経路の生存確認用。常に発火します"
  - name: home-lab-node-storage
    interval: 1m
    rules:
      # capacity - usage は空きの推定値。アプリの f_bavail による4GiB保護は別途維持する。
      # 5GiBの動画 + 4GiBの保護領域より早く警告し、割合でもkubeletの退避前に検知する。
      - alert: KubernetesNodeDiskSpaceLow
        expr: >-
          ((max by(node) (container_fs_limit_bytes{job="kubelet-node-filesystem",id="/",device="/dev/vda1"}) > 0)
          - max by(node) (container_fs_usage_bytes{job="kubelet-node-filesystem",id="/",device="/dev/vda1"}) < 12 * 1024^3)
          or (max by(node) (container_fs_usage_bytes{job="kubelet-node-filesystem",id="/",device="/dev/vda1"})
          / (max by(node) (container_fs_limit_bytes{job="kubelet-node-filesystem",id="/",device="/dev/vda1"}) > 0) > 0.8)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} のルートディスク空き推定値が12GiBまたは20%未満です"
      - alert: KubernetesNodeDiskSpaceCritical
        expr: >-
          ((max by(node) (container_fs_limit_bytes{job="kubelet-node-filesystem",id="/",device="/dev/vda1"}) > 0)
          - max by(node) (container_fs_usage_bytes{job="kubelet-node-filesystem",id="/",device="/dev/vda1"}) < 9 * 1024^3)
          or (max by(node) (container_fs_usage_bytes{job="kubelet-node-filesystem",id="/",device="/dev/vda1"})
          / (max by(node) (container_fs_limit_bytes{job="kubelet-node-filesystem",id="/",device="/dev/vda1"}) > 0) > 0.85)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} のルートディスク空き推定値が9GiBまたは15%未満です。大容量取得・CIの一時領域を確認してください"
      - alert: KubernetesNodeDiskMetricsUnavailable
        expr: >-
          max by(node) (kube_node_info)
          unless on(node)
          ((max by(node) (container_fs_limit_bytes{job="kubelet-node-filesystem",id="/",device="/dev/vda1"}) > 0)
          and on(node) max by(node) (container_fs_usage_bytes{job="kubelet-node-filesystem",id="/",device="/dev/vda1"}))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} のルートディスク容量を収集できません"
  - name: home-lab-host
    interval: 1m
    rules:
      # ホストは VM 2台の合計 13GiB を 15GiB の実メモリで支える。余裕がなくなると qemu が swap へ出て
      # control-plane の応答が遅れる（docs/host-capacity.md）。
      - alert: HostMetricsUnavailable
        expr: up{job="host-node"} == 0 or absent(up{job="host-node"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ホストの node_exporter（192.168.122.1:9100）を収集できません"
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes{job="host-node"} < 768 * 1024^2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "ホストの利用可能メモリが 768MiB 未満です。VM のメモリ宣言と swap を確認してください"
      - alert: HostSwapThrashing
        # 使われないページの退避（数十 KB/s）は正常。継続的な swap in / out だけを通知する。
        expr: >-
          (rate(node_vmstat_pswpin{job="host-node"}[10m]) + rate(node_vmstat_pswpout{job="host-node"}[10m])) > 500
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ホストで swap in / out が継続しています（毎秒 500 page 超）"
      - alert: HostCPUPressure
        expr: rate(node_pressure_cpu_waiting_seconds_total{job="host-node"}[10m]) > 0.25
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "ホストの CPU PSI（some）が 25% を超えています"
      - alert: HostDiskSpaceLow
        expr: >-
          node_filesystem_avail_bytes{job="host-node",mountpoint="/"}
          / node_filesystem_size_bytes{job="host-node",mountpoint="/"} < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ホストのルートディスク空きが 15% 未満です（VM ディスクを含む）"
  - name: home-lab-state
    interval: 30s
    rules:
      - alert: ApplicationQueueFailed
        expr: >-
          (sum by(queue) (max by(queue,state)
          (application_queue_jobs{namespace="sandbox",state=~"failed|uncertain"}))
          unless on(queue) max by(queue) (application_failure_records{namespace="sandbox"})) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.queue }} に失敗または配送結果不明の処理があります"
      - alert: ApplicationUnreviewedFailure
        expr: >-
          max by(queue) (application_failure_records{namespace="sandbox",disposition="unreviewed"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.queue }} に未確認の取得失敗があります（新規または再発）"
      - alert: ApplicationQueueBacklog
        expr: >-
          (max by(queue) (application_queue_oldest_pending_age_seconds{namespace="sandbox",queue=~"notifications|hitomi_outbox"}) > 900)
          or ((max by(queue) (application_queue_oldest_pending_age_seconds{namespace="sandbox",queue=~"media|hitomi_items"})
          unless on(queue) application_queue_oldest_unreviewed_pending_age_seconds{namespace="sandbox"}) > 7200)
          or (max by(queue) (application_queue_oldest_unreviewed_pending_age_seconds{namespace="sandbox",queue=~"media|hitomi_items"}) > 7200)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.queue }} の未完了処理が滞留しています"
      - alert: ApplicationQueueMetricsUnavailable
        expr: >-
          absent(application_queue_jobs{namespace="sandbox",queue="notifications"})
          or absent(application_queue_jobs{namespace="sandbox",queue="hitomi_outbox"})
          or absent(application_queue_jobs{namespace="sandbox",queue="media"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.queue }} の業務メトリクスを収集できません"
      - alert: CameraSpoolStatisticsUnavailable
        expr: >-
          home_camera_spool_stats_success == 0
          or absent(home_camera_spool_stats_success)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "cameraのspool集計結果を確認できません"
      - alert: CameraInvalidManifest
        expr: home_camera_invalid_manifests > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "cameraのspoolに不正なmanifestがあります"
      - alert: CameraRecordingStalled
        expr: home_camera_recording_stalled == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "cameraの完成segmentが停止しています"
      - alert: CameraSpoolBlocked
        expr: home_camera_spool_blocked == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "cameraのspool空き容量不足で録画が停止しています"
      - alert: CameraUploadBacklog
        expr: home_camera_spool_oldest_age_seconds > 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "cameraの未送信segmentが1時間以上滞留しています"
      - alert: CameraPartialSegment
        expr: home_camera_partial_segments > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "cameraのspoolに復旧できないsegmentがあります"
      - alert: CameraNotRecording
        expr: >-
          (home_camera_recording_active == 0)
          and on() ((hour(vector(time() + 9 * 3600)) >= 19)
          or (hour(vector(time() + 9 * 3600)) < 9))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "録画時間帯にcameraの録画が停止しています"
      - alert: NetworkPolicyControllerUnavailable
        expr: >-
          (kube_daemonset_status_desired_number_scheduled{namespace="kube-system",daemonset="kube-network-policies"}
          > kube_daemonset_status_number_available{namespace="kube-system",daemonset="kube-network-policies"})
          or absent(kube_daemonset_status_desired_number_scheduled{namespace="kube-system",daemonset="kube-network-policies"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "NetworkPolicy controller が不足しています（fail-open により通信制限が解除される可能性）"
      - alert: NetworkPolicyControllerMetricsUnavailable
        expr: >-
          up{job="kubernetes-pods-annotated",namespace="kube-system",pod=~"kube-network-policies-.*"} == 0
          or absent(up{job="kubernetes-pods-annotated",namespace="kube-system",pod=~"kube-network-policies-.*"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "NetworkPolicy controller の metrics を収集できません"
      - alert: KubeletServingCertificateInvalid
        expr: >-
          kubelet_serving_certificate_valid == 0 or absent(kubelet_serving_certificate_valid)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "kubelet serving 証明書を検証できません"
      - alert: KubeletServingCertificateExpiring
        expr: >-
          (kubelet_serving_certificate_expiry_seconds - time() < 14 * 86400)
          and (kubelet_serving_certificate_valid == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} の serving 証明書の有効期限が14日以内です"
      - alert: KubeletServingApproverUnavailable
        expr: >-
          time() - kubelet_serving_approver_last_success_seconds > 180
          or absent(kubelet_serving_approver_last_success_seconds)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "kubelet serving CSR 自動承認処理が停止しています"
      - alert: KubeStateMetricsUnavailable
        expr: >-
          up{job="kube-state-metrics"} == 0 or absent(up{job="kube-state-metrics"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes の状態メトリクスを収集できません"
      - alert: KubernetesNodeNotReady
        expr: >-
          kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} が Ready ではありません"
      - alert: KubernetesPodNotReady
        expr: >-
          (kube_pod_status_ready{condition="true"} == 0) and on(namespace,pod,uid) (kube_pod_status_phase{phase=~"Pending|Running|Unknown"} == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} が Ready ではありません"
      - alert: KubernetesPodRestarting
        expr: >-
          increase(kube_pod_container_status_restarts_total[15m]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} のコンテナが再起動を繰り返しています"
      # CronJob 由来の Job が失敗したら通知する。開始から6時間を過ぎた失敗は通知を止める。
      - alert: KubernetesCronJobFailed
        expr: >-
          (kube_job_status_failed > 0)
          * on(namespace, job_name) group_left(owner_name) kube_job_owner{owner_kind="CronJob"}
          and on(namespace, job_name) (time() - kube_job_status_start_time < 6 * 3600)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "CronJob {{ $labels.namespace }}/{{ $labels.owner_name }} の Job {{ $labels.job_name }} が失敗しました"
      - alert: KubernetesDeploymentUnavailable
        expr: >-
          kube_deployment_spec_replicas > kube_deployment_status_replicas_available
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} の必要 replica が不足しています"
      - alert: KubernetesPVCNotBound
        expr: >-
          kube_persistentvolumeclaim_status_phase{phase=~"Pending|Lost"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} が Bound ではありません"
      - alert: ArgoCDApplicationOutOfSync
        expr: >-
          kube_argocd_application_sync_status{status=~"OutOfSync|Unknown"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Application {{ $labels.application }} が同期できていません"
      - alert: ArgoCDApplicationUnhealthy
        expr: >-
          kube_argocd_application_health_status{status=~"Degraded|Missing|Unknown"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Application {{ $labels.application }} が異常状態です"
      - alert: ExternalSecretNotReady
        expr: >-
          kube_externalsecret_status_condition{type="Ready"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.externalsecret }} が Ready ではありません"
      - alert: GatewayNotProgrammed
        expr: >-
          kube_gateway_status_condition{type="Programmed"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Gateway {{ $labels.namespace }}/{{ $labels.gateway }} が Programmed ではありません"
      - alert: CertificateNotReady
        expr: >-
          kube_certificate_status_condition{type="Ready"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Certificate {{ $labels.namespace }}/{{ $labels.certificate }} が Ready ではありません"
      - alert: KubernetesVolumeSpaceLow
        expr: >-
          min by(namespace,persistentvolumeclaim)
          (kubelet_volume_stats_available_bytes / (kubelet_volume_stats_capacity_bytes > 0)) < 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} のファイルシステム空き容量が 20% 未満です（NFS は共有容量）"
      - alert: KubernetesVolumeSpaceCritical
        expr: >-
          min by(namespace,persistentvolumeclaim)
          (kubelet_volume_stats_available_bytes / (kubelet_volume_stats_capacity_bytes > 0)) < 0.1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} のファイルシステム空き容量が 10% 未満です（NFS は共有容量）"
      - alert: KubeletVolumeScrapeUnavailable
        expr: >-
          up{job="kubelet-volume-stats"} == 0 or absent(up{job="kubelet-volume-stats"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "kubelet の容量メトリクスを収集できません"
      - alert: HarborMaintenanceStalled
        expr: >-
          time() - kube_cronjob_status_last_successful_time{namespace="harbor",cronjob="harbor-maintenance"} > 1800
          or absent(kube_cronjob_status_last_successful_time{namespace="harbor",cronjob="harbor-maintenance"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Harbor自動保守が30分以上成功していません。Jobログと配布状態を確認してください"
      # pgBackRest: full（日曜）と diff（月〜土）が毎日 18:00 UTC に実行される。
      # どちらかの成功が26時間ない場合に通知する。DBの重要度が低いため warning とする。
      - alert: PostgreSQLBackupStale
        expr: >-
          time() - max(kube_cronjob_status_last_successful_time{namespace="database",cronjob=~"shared-postgresql-repo1-(full|diff)"}) > 26 * 3600
          or absent(kube_cronjob_status_last_successful_time{namespace="database",cronjob=~"shared-postgresql-repo1-(full|diff)"})
        for: 30m
        labels:
          severity: warning
          namespace: database
        annotations:
          summary: "共通PostgreSQLのpgBackRestバックアップが26時間以上成功していません。database namespaceのbackup Jobとrepo-hostのログを確認してください"
      # 直近のスケジュール実行が成功していない（失敗・未完了）状態が続く場合。実行中の数分は for で除外する。
      - alert: PostgreSQLBackupFailed
        expr: >-
          kube_cronjob_status_last_schedule_time{namespace="database",cronjob=~"shared-postgresql-repo1-(full|diff)"}
          > kube_cronjob_status_last_successful_time{namespace="database",cronjob=~"shared-postgresql-repo1-(full|diff)"}
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "pgBackRest {{ $labels.cronjob }} の直近の実行が成功していません。kubectl -n database get jobs で失敗Jobを確認してください"
      # RustFS scanner は lifecycle（30日保持）も実行する。停止すると期限切れ削除が止まり容量が増え続ける。
      # 通常は約10分ごとに1周を完了する（2026-11-10 実測）。
      - alert: RustFSScannerStalled
        expr: >-
          time() - max(max_over_time(rustfs_scanner_last_cycle_end_timestamp_seconds[1h])) > 6 * 3600
        for: 15m
        labels:
          severity: warning
          namespace: rustfs
        annotations:
          summary: "RustFS scannerが6時間以上走査を完了していません（lifecycleの期限切れ削除も停止）。scanner statusとrustfsのログを確認してください"
      - alert: RustFSScannerMonitorMissing
        expr: >-
          time() - max(max_over_time(rustfs_scanner_monitor_last_run_timestamp_seconds[2h])) > 3600
          or absent_over_time(rustfs_scanner_monitor_last_run_timestamp_seconds[2h])
        for: 15m
        labels:
          severity: warning
          namespace: rustfs
        annotations:
          summary: "RustFS scannerの監視Jobが1時間以上メトリクスを送信していません。rustfs-scanner-monitor CronJobを確認してください"
      - alert: HarborRepositoryBlocked
        # 配布・切替中の短時間のblockedは正常。1時間継続したrepoだけを通知する。
        expr: max by (repository) (max_over_time(harbor_maintenance_repository_blocked[15m])) == 1
        for: 1h
        labels:
          severity: warning
          namespace: harbor
        annotations:
          summary: "Harbor保守で {{ $labels.repository }} が1時間以上保留されています（保持処理の対象外）。harbor-maintenance Jobログの reason を確認してください"
