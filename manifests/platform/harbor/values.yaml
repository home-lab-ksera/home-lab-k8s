expose:
  type: clusterIP
  tls:
    enabled: false

externalURL: https://harbor.internal.qroksera.com

existingSecretSecretKey: harbor-internal-secret

existingSecretAdminPassword: harbor-admin-secret
existingSecretAdminPasswordKey: password

persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      size: 10Gi
      storageClass: nfs-external
    jobservice:
      jobLog:
        size: 1Gi
        storageClass: nfs-external
    database:
      size: 1Gi
      storageClass: nfs-external
    redis:
      size: 1Gi
      storageClass: nfs-external

database:
  type: external
  external:
    host: shared-postgresql-primary.database.svc
    port: "5432"
    username: app
    coreDatabase: registry
    existingSecret: harbor-database-secret
    sslmode: verify-full
  maxOpenConns: 10
  maxIdleConns: 3

redis:
  type: internal
  internal:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

# 観測値と反映後の確認方法: docs/resource-sizing.md
nginx:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 脆弱性スキャンは各アプリの GitHub Actions（trivy-action）で行う。
# 常駐 Pod と NFS 上の脆弱性 DB（約1.6GiB）を削減するため無効化（2026-11-11）。
trivy:
  enabled: false

core:
  existingSecret: harbor-internal-secret
  secretName: harbor-internal-secret
  existingXsrfSecret: harbor-internal-secret
  existingXsrfSecretKey: CSRF_KEY
  priorityClassName: homelab-platform
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

portal:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

registry:
  existingSecret: harbor-internal-secret
  credentials:
    existingSecret: harbor-internal-secret
  priorityClassName: homelab-platform
  registry:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  controller:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

jobservice:
  existingSecret: harbor-internal-secret
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 256Mi
