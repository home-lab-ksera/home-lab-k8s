apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - lifecycle-job.yaml
  - lifecycle-networkpolicy.yaml
  - scanner-monitor.yaml

configMapGenerator:
  - name: rustfs-lifecycle
    namespace: rustfs
    files:
      - lifecycle.json
      - cors.json
      - buckets.txt
      - apply-lifecycle.sh
  - name: rustfs-scanner-monitor
    namespace: rustfs
    files:
      - scripts/scanner-monitor.py

helmCharts:
  - name: rustfs
    repo: https://charts.rustfs.com
    version: 1.0.2
    releaseName: rustfs
    namespace: rustfs
    valuesFile: values.yaml
