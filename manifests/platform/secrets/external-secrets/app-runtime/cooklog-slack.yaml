apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cooklog-slack
  namespace: sandbox
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: pulumi-esc-store
    kind: ClusterSecretStore
  target:
    name: cooklog-slack
    creationPolicy: Owner
  data:
    - secretKey: SLACK_APP_TOKEN
      remoteRef:
        key: cooklog-slack-app-token
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: github
