apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-postgresql
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: pulumi-esc-store
    kind: ClusterSecretStore
  target:
    name: grafana-postgresql
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: postgresql.password
