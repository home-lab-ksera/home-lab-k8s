# デッドマンスイッチの送信先（healthchecks.io の Ping URL）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-heartbeat
  namespace: observability
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: pulumi-esc-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-heartbeat
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: alertmanager-heartbeat-url
