apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: sandbox-images
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  commonUpdateSettings:
    updateStrategy: digest
    # CronJob に実行中の Pod がなくても更新する。
    forceUpdate: true
  writeBackConfig:
    # Argo CD repository credentials 経由で SSH host key 検証を有効にする。
    method: git
    gitConfig:
      repository: git@github.com:home-lab-ksera/home-lab-k8s.git
      branch: main
      writeBackTarget: kustomization
  applicationRefs:
    - namePattern: api-hub
      images:
        - alias: app
          imageName: harbor.internal.qroksera.com/sandbox/api-hub:latest
          manifestTargets:
            kustomize:
              name: harbor.internal.qroksera.com/sandbox/api-hub
    - namePattern: blog
      images:
        - alias: app
          imageName: harbor.internal.qroksera.com/sandbox/blog:latest
          manifestTargets:
            kustomize:
              name: harbor.internal.qroksera.com/sandbox/blog
    - namePattern: dashboard
      images:
        - alias: app
          imageName: harbor.internal.qroksera.com/sandbox/dashboard:latest
          manifestTargets:
            kustomize:
              name: harbor.internal.qroksera.com/sandbox/dashboard
    - namePattern: hitomi
      images:
        - alias: app
          imageName: harbor.internal.qroksera.com/sandbox/hitomi:latest
          manifestTargets:
            kustomize:
              name: harbor.internal.qroksera.com/sandbox/hitomi
    - namePattern: hitomi-pdf
      images:
        - alias: app
          imageName: harbor.internal.qroksera.com/sandbox/hitomi-pdf-batch:latest
          manifestTargets:
            kustomize:
              name: harbor.internal.qroksera.com/sandbox/hitomi-pdf-batch
    - namePattern: home-camera
      images:
        - alias: app
          imageName: harbor.internal.qroksera.com/sandbox/home-camera:latest
          manifestTargets:
            kustomize:
              name: harbor.internal.qroksera.com/sandbox/home-camera
    - namePattern: market-collector
      images:
        - alias: app
          imageName: harbor.internal.qroksera.com/sandbox/market-collector:latest
          manifestTargets:
            kustomize:
              name: harbor.internal.qroksera.com/sandbox/market-collector
    - namePattern: nature-remo
      images:
        - alias: app
          imageName: harbor.internal.qroksera.com/sandbox/nature-remo:latest
          manifestTargets:
            kustomize:
              name: harbor.internal.qroksera.com/sandbox/nature-remo
    - namePattern: rsshub
      images:
        - alias: app
          imageName: harbor.internal.qroksera.com/sandbox/rsshub-private:latest
          manifestTargets:
            kustomize:
              name: harbor.internal.qroksera.com/sandbox/rsshub-private
