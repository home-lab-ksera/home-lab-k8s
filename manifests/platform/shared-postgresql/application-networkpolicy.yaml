apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-application-postgresql
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      database.k8s-myhome.local/shared-postgresql: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
