apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - application-config.yaml
  - postgresql.yaml
  - backup.yaml
  - restore-drill.yaml
  - application-networkpolicy.yaml
configMapGenerator:
  - name: postgresql-init
    namespace: database
    files:
      - 10-roles.sh=scripts/init-roles.sh
      - 20-bootstrap.sql=scripts/bootstrap.sql
  - name: postgresql-restore-drill
    namespace: database
    files:
      - restore-drill.sh=scripts/restore-drill.sh
