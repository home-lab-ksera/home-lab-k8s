# Tailnet Split DNS向けCoreDNS
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-split-dns
  namespace: tailscale
  annotations:
    contracts.k8s-myhome.local/service-ip: network.serviceIPs.gateway
    contracts.k8s-myhome.local/access-surfaces: nature-remo-internal,harbor-internal,cooklog-internal,hitomi-upload-viewer-internal,api-hub-internal,rsshub-internal,observability-internal,grafana-internal,argocd-internal,s3-internal,rustfs-console-internal,blog-internal
data:
  Corefile: |
    internal.qroksera.com:53 {
        errors
        health
        ready
        hosts {
            192.168.122.100 harbor.internal.qroksera.com
            192.168.122.100 argocd.internal.qroksera.com
            192.168.122.100 s3.internal.qroksera.com
            192.168.122.100 rustfs.internal.qroksera.com
            192.168.122.100 blog.internal.qroksera.com
            192.168.122.100 cooklog.internal.qroksera.com
            192.168.122.100 nature-remo.internal.qroksera.com
            192.168.122.100 hitomi-upload-viewer.internal.qroksera.com
            192.168.122.100 api-hub.internal.qroksera.com
            192.168.122.100 rsshub.internal.qroksera.com
            192.168.122.100 observability.internal.qroksera.com
            192.168.122.100 grafana.internal.qroksera.com
            fallthrough
        }
        cache 30
        reload
    }
---
# Tailnet Split DNSの名前解決Pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-split-dns
  namespace: tailscale
  labels:
    app: tailscale-split-dns
  annotations:
    contracts.k8s-myhome.local/service-ip: network.serviceIPs.tailscaleSplitDNS
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: tailscale-split-dns
  template:
    metadata:
      labels:
        app: tailscale-split-dns
    spec:
      priorityClassName: homelab-platform
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.14.7
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: metrics
              containerPort: 9153
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/coredns
      volumes:
        - name: config-volume
          configMap:
            name: tailscale-split-dns
            items:
              - key: Corefile
                path: Corefile
---
# Tailnet Split DNSをLB IPで公開
apiVersion: v1
kind: Service
metadata:
  name: tailscale-split-dns
  namespace: tailscale
  labels:
    app: tailscale-split-dns
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.122.101
  selector:
    app: tailscale-split-dns
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 53
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53
