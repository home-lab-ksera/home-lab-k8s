# CoreDNS設定（内部公開ドメインを固定IPに解決）
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        hosts {
            192.168.122.100 s3.internal.qroksera.com
            192.168.122.100 rustfs.internal.qroksera.com
            192.168.122.100 blog.internal.qroksera.com
            192.168.122.100 harbor.internal.qroksera.com
            192.168.122.100 argocd.internal.qroksera.com
            192.168.122.100 cooklog.internal.qroksera.com
            192.168.122.100 nature-remo.internal.qroksera.com
            192.168.122.100 hitomi-upload-viewer.internal.qroksera.com
            192.168.122.100 api-hub.internal.qroksera.com
            192.168.122.100 rsshub.internal.qroksera.com
            192.168.122.100 observability.internal.qroksera.com
            192.168.122.100 grafana.internal.qroksera.com
            fallthrough
        }
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30
        loop
        reload
        loadbalance
    }
