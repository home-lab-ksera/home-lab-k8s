apiVersion: contracts.k8s-myhome.local/v1alpha2
kind: AccessSurfaceContract
metadata:
  name: home-lab
spec:
  surfaces:
    argocd-external:
      hostname: argocd.qroksera.com
      exposure: external
      gatewayListener: https-argocd-external
      publish:
        coreDNS: false
        tailscaleSplitDNS: false
      type: gateway-http
      gateway:
        namespace: nginx-gateway
        name: nginx-gateway
        className: nginx
      tls:
        certificate: wildcard-external
        secret: wildcard-external-tls
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-cloudflare
      routes:
      - namespace: argocd
        name: argocd-external
        listener: https-argocd-external
        profile: argocd-external
      - namespace: argocd
        name: argocd-external-redirect
        listener: http
        profile: argocd-external-redirect
    argocd-internal:
      hostname: argocd.internal.qroksera.com
      exposure: internal
      gatewayListener: https-argocd-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
      type: gateway-http
      gateway:
        namespace: nginx-gateway
        name: nginx-gateway
        className: nginx
      tls:
        certificate: argocd-internal
        secret: argocd-internal-tls
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-cloudflare
      routes:
      - namespace: argocd
        name: argocd-internal
        listener: https-argocd-internal
        profile: argocd-external
      - namespace: argocd
        name: argocd-internal-redirect
        listener: http
        profile: argocd-external-redirect
    harbor-external:
      hostname: harbor.qroksera.com
      exposure: internal
      gatewayListener: https-harbor-external
      publish:
        coreDNS: true
        tailscaleSplitDNS: false
      type: gateway-http
      gateway:
        namespace: nginx-gateway
        name: nginx-gateway
        className: nginx
      tls:
        certificate: wildcard-external
        secret: wildcard-external-tls
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-cloudflare
      routes:
      - namespace: harbor
        name: harbor-external
        listener: https-harbor-external
        profile: harbor-external
      - namespace: harbor
        name: harbor-external-redirect
        listener: http
        profile: argocd-external-redirect
    harbor-internal:
      hostname: harbor.internal.qroksera.com
      exposure: internal
      gatewayListener: https-harbor-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
      type: gateway-http
      gateway:
        namespace: nginx-gateway
        name: nginx-gateway
        className: nginx
      tls:
        certificate: harbor-internal
        secret: harbor-internal-tls
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-cloudflare
      routes:
      - namespace: harbor
        name: harbor-internal
        listener: https-harbor-internal
        profile: harbor-external
      - namespace: harbor
        name: harbor-internal-redirect
        listener: http
        profile: argocd-external-redirect
    rustfs-console:
      hostname: rustfs.qroksera.com
      exposure: external
      gatewayListener: https-rustfs
      publish:
        coreDNS: false
        tailscaleSplitDNS: false
      type: gateway-http
      gateway:
        namespace: nginx-gateway
        name: nginx-gateway
        className: nginx
      tls:
        certificate: wildcard-external
        secret: wildcard-external-tls
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-cloudflare
      routes:
      - namespace: rustfs
        name: rustfs-console
        listener: https-rustfs
        profile: rustfs-console
      - namespace: rustfs
        name: rustfs-console-redirect
        listener: http
        profile: argocd-external-redirect
    blog-external:
      hostname: blog.qroksera.com
      exposure: external
      gatewayListener: https-blog-external
      publish:
        coreDNS: false
        tailscaleSplitDNS: false
      type: gateway-http
      gateway:
        namespace: nginx-gateway
        name: nginx-gateway
        className: nginx
      tls:
        certificate: wildcard-external
        secret: wildcard-external-tls
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-cloudflare
      routes:
      - namespace: sandbox
        name: blog-external
        listener: https-blog-external
        profile: blog-external
      - namespace: sandbox
        name: blog-external-redirect
        listener: http
        profile: argocd-external-redirect
    cooklog-internal:
      hostname: cooklog.internal.qroksera.com
      exposure: internal
      gatewayListener: https-cooklog-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
      type: gateway-http
      gateway:
        namespace: nginx-gateway
        name: nginx-gateway
        className: nginx
      tls:
        certificate: cooklog-internal
        secret: cooklog-internal-tls
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-cloudflare
      routes:
      - namespace: sandbox
        name: cooklog-internal
        listener: https-cooklog-internal
        profile: cooklog-internal
      - namespace: sandbox
        name: cooklog-internal-redirect
        listener: http
        profile: argocd-external-redirect
    api-hub-internal:
      hostname: api-hub.internal.qroksera.com
      exposure: internal
      gatewayListener: https-api-hub-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
      type: gateway-http
      gateway:
        namespace: nginx-gateway
        name: nginx-gateway
        className: nginx
      tls:
        certificate: api-hub-internal
        secret: api-hub-internal-tls
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-cloudflare
      routes:
      - namespace: sandbox
        name: api-hub-internal
        listener: https-api-hub-internal
        profile: api-hub-internal
      - namespace: sandbox
        name: api-hub-internal-redirect
        listener: http
        profile: argocd-external-redirect
    hitomi-upload-viewer-internal:
      hostname: hitomi-upload-viewer.internal.qroksera.com
      exposure: internal
      gatewayListener: https-hitomi-upload-viewer-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
      type: gateway-http
      gateway:
        namespace: nginx-gateway
        name: nginx-gateway
        className: nginx
      tls:
        certificate: hitomi-upload-viewer-internal
        secret: hitomi-upload-viewer-internal-tls
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-cloudflare
      routes:
      - namespace: sandbox
        name: hitomi-upload-viewer-internal
        listener: https-hitomi-upload-viewer-internal
        profile: hitomi-upload-viewer-internal
      - namespace: sandbox
        name: hitomi-upload-viewer-internal-redirect
        listener: http
        profile: argocd-external-redirect
    observability-internal:
      hostname: observability.internal.qroksera.com
      exposure: internal
      gatewayListener: https-observability-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
      type: gateway-http
      gateway:
        namespace: nginx-gateway
        name: nginx-gateway
        className: nginx
      tls:
        certificate: observability-internal
        secret: observability-internal-tls
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-cloudflare
      routes:
      - namespace: observability
        name: observability-internal
        listener: https-observability-internal
        profile: observability-internal
      - namespace: observability
        name: observability-internal-redirect
        listener: http
        profile: argocd-external-redirect
    rsshub-internal:
      hostname: rsshub.internal.qroksera.com
      exposure: internal
      gatewayListener: https-rsshub-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
      type: gateway-http
      gateway:
        namespace: nginx-gateway
        name: nginx-gateway
        className: nginx
      tls:
        certificate: rsshub-internal
        secret: rsshub-internal-tls
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-cloudflare
      routes:
      - namespace: sandbox
        name: rsshub-internal
        listener: https-rsshub-internal
        profile: rsshub-internal
      - namespace: sandbox
        name: rsshub-internal-redirect
        listener: http
        profile: argocd-external-redirect
    blog-internal:
      hostname: blog.internal.qroksera.com
      exposure: internal
      gatewayListener: https-blog-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
      type: gateway-http
      gateway:
        namespace: nginx-gateway
        name: nginx-gateway
        className: nginx
      tls:
        certificate: blog-internal
        secret: blog-internal-tls
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-cloudflare
      routes:
      - namespace: sandbox
        name: blog-internal
        listener: https-blog-internal
        profile: blog-external
      - namespace: sandbox
        name: blog-internal-redirect
        listener: http
        profile: argocd-external-redirect
    rustfs-console-internal:
      hostname: rustfs.internal.qroksera.com
      exposure: internal
      gatewayListener: https-rustfs-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
      type: gateway-http
      gateway:
        namespace: nginx-gateway
        name: nginx-gateway
        className: nginx
      tls:
        certificate: rustfs-internal
        secret: rustfs-internal-tls
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-cloudflare
      routes:
      - namespace: rustfs
        name: rustfs-console-internal
        listener: https-rustfs-internal
        profile: rustfs-console
      - namespace: rustfs
        name: rustfs-console-internal-redirect
        listener: http
        profile: argocd-external-redirect
    grafana-internal:
      hostname: grafana.internal.qroksera.com
      exposure: internal
      gatewayListener: https-grafana-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
      type: gateway-http
      gateway:
        namespace: nginx-gateway
        name: nginx-gateway
        className: nginx
      tls:
        certificate: grafana-internal
        secret: grafana-internal-tls
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-cloudflare
      routes:
      - namespace: observability
        name: grafana-internal
        listener: https-grafana-internal
        profile: grafana-internal
      - namespace: observability
        name: grafana-internal-redirect
        listener: http
        profile: argocd-external-redirect
    s3-internal:
      hostname: s3.internal.qroksera.com
      exposure: internal
      gatewayListener: https-s3-internal
      publish:
        coreDNS: true
        tailscaleSplitDNS: true
      type: gateway-http
      gateway:
        namespace: nginx-gateway
        name: nginx-gateway
        className: nginx
      tls:
        certificate: s3-internal
        secret: s3-internal-tls
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-cloudflare
      routes:
      - namespace: rustfs
        name: s3-internal
        listener: https-s3-internal
        profile: s3-internal
    nature-remo-tailnet:
      type: tailscale-ingress
      exposure: internal
      identity:
        group: networking.k8s.io
        kind: Ingress
        namespace: sandbox
        name: nature-remo
      spec:
        ingressClassName: tailscale
        rules:
        - http:
            paths:
            - backend:
                service:
                  name: nature-remo
                  port:
                    number: 80
              path: /
              pathType: Prefix
        tls:
        - hosts:
          - nature-remo
      annotations:
        tailscale.com/tags: tag:k8s
  profiles:
    argocd-external:
    - backendRefs:
      - group: ''
        kind: Service
        name: argocd-server
        port: 80
        weight: 1
        namespace: argocd
      matches:
      - path:
          type: PathPrefix
          value: /
    argocd-external-redirect:
    - filters:
      - requestRedirect:
          scheme: https
          statusCode: 301
        type: RequestRedirect
      matches:
      - path:
          type: PathPrefix
          value: /
    harbor-external:
    - backendRefs:
      - group: ''
        kind: Service
        name: harbor-core
        port: 80
        weight: 1
        namespace: harbor
      matches:
      - path:
          type: PathPrefix
          value: /api/
    - backendRefs:
      - group: ''
        kind: Service
        name: harbor-core
        port: 80
        weight: 1
        namespace: harbor
      matches:
      - path:
          type: PathPrefix
          value: /service/
    - backendRefs:
      - group: ''
        kind: Service
        name: harbor-core
        port: 80
        weight: 1
        namespace: harbor
      matches:
      - path:
          type: PathPrefix
          value: /v2/
    - backendRefs:
      - group: ''
        kind: Service
        name: harbor-core
        port: 80
        weight: 1
        namespace: harbor
      matches:
      - path:
          type: PathPrefix
          value: /chartrepo/
    - backendRefs:
      - group: ''
        kind: Service
        name: harbor-core
        port: 80
        weight: 1
        namespace: harbor
      matches:
      - path:
          type: PathPrefix
          value: /c/
    - backendRefs:
      - group: ''
        kind: Service
        name: harbor-portal
        port: 80
        weight: 1
        namespace: harbor
      matches:
      - path:
          type: PathPrefix
          value: /
    rustfs-console:
    - filters:
      - requestRedirect:
          path:
            replaceFullPath: /rustfs/console/
            type: ReplaceFullPath
          statusCode: 302
        type: RequestRedirect
      matches:
      - method: GET
        path:
          type: Exact
          value: /
      - method: HEAD
        path:
          type: Exact
          value: /
    - backendRefs:
      - group: ''
        kind: Service
        name: rustfs-svc
        port: 9001
        weight: 1
        namespace: rustfs
      matches:
      - method: POST
        path:
          type: Exact
          value: /
      - headers:
        - name: Authorization
          type: RegularExpression
          value: .+
        method: GET
        path:
          type: Exact
          value: /
      - path:
          type: PathPrefix
          value: /
    blog-external:
    - backendRefs:
      - group: ''
        kind: Service
        name: blog
        port: 80
        weight: 1
        namespace: sandbox
      matches:
      - path:
          type: PathPrefix
          value: /
    cooklog-internal:
    - backendRefs:
      - group: ''
        kind: Service
        name: cooklog
        port: 80
        weight: 1
        namespace: sandbox
      matches:
      - path:
          type: PathPrefix
          value: /
    api-hub-internal:
    - backendRefs:
      - group: ''
        kind: Service
        name: api-hub
        port: 3000
        weight: 1
        namespace: sandbox
      matches:
      - path:
          type: PathPrefix
          value: /
    hitomi-upload-viewer-internal:
    - backendRefs:
      - group: ''
        kind: Service
        name: media-api
        port: 3000
        weight: 1
        namespace: sandbox
      matches:
      - path:
          type: PathPrefix
          value: /media/
    - backendRefs:
      - group: ''
        kind: Service
        name: hitomi-upload-viewer
        port: 80
        weight: 1
        namespace: sandbox
      matches:
      - path:
          type: PathPrefix
          value: /
    observability-internal:
    - backendRefs:
      - group: ''
        kind: Service
        name: victoria-metrics
        port: 8428
        weight: 1
        namespace: observability
      matches:
      - path:
          type: PathPrefix
          value: /
    rsshub-internal:
    - backendRefs:
      - group: ''
        kind: Service
        name: rsshub
        port: 1200
        weight: 1
        namespace: sandbox
      matches:
      - path:
          type: PathPrefix
          value: /
    grafana-internal:
    - backendRefs:
      - group: ''
        kind: Service
        name: grafana
        port: 3000
        weight: 1
        namespace: observability
      matches:
      - path:
          type: PathPrefix
          value: /
    s3-internal:
    - backendRefs:
      - group: ''
        kind: Service
        name: rustfs-svc
        port: 9000
        weight: 1
        namespace: rustfs
      matches:
      - method: GET
        path:
          type: PathPrefix
          value: /pdfs/hitomi/
      - method: GET
        path:
          type: PathPrefix
          value: /pdfs/videos/
      - method: HEAD
        path:
          type: PathPrefix
          value: /pdfs/hitomi/
      - method: HEAD
        path:
          type: PathPrefix
          value: /pdfs/videos/
      - method: OPTIONS
        path:
          type: PathPrefix
          value: /pdfs/hitomi/
      - method: OPTIONS
        path:
          type: PathPrefix
          value: /pdfs/videos/
      - method: GET
        path:
          type: PathPrefix
          value: /home-camera-recordings/
      - method: HEAD
        path:
          type: PathPrefix
          value: /home-camera-recordings/
      - method: OPTIONS
        path:
          type: PathPrefix
          value: /home-camera-recordings/
  policies:
  - identity:
      group: gateway.nginx.org
      kind: ClientSettingsPolicy
      namespace: sandbox
      name: api-hub-internal-client-settings
    spec:
      body:
        maxSize: '0'
      targetRef:
        group: gateway.networking.k8s.io
        kind: HTTPRoute
        name: api-hub-internal
  - identity:
      group: gateway.nginx.org
      kind: ClientSettingsPolicy
      namespace: harbor
      name: harbor-external-client-settings
    spec:
      body:
        maxSize: '0'
      targetRef:
        group: gateway.networking.k8s.io
        kind: HTTPRoute
        name: harbor-external
  - identity:
      group: gateway.nginx.org
      kind: ClientSettingsPolicy
      namespace: harbor
      name: harbor-internal-client-settings
    spec:
      body:
        maxSize: '0'
      targetRef:
        group: gateway.networking.k8s.io
        kind: HTTPRoute
        name: harbor-internal
