apiVersion: contracts.k8s-myhome.local/v1alpha2
kind: ClusterContract
metadata:
  name: home-lab
spec:
  global:
    domain:
      external: qroksera.com
      internal: internal.qroksera.com
  network:
    host:
      cidr: 192.168.122.0/24
    nodes:
      controlPlane: 192.168.122.10
      workers:
      - 192.168.122.11
      - 192.168.122.12
    podCIDR: 10.244.0.0/16
    serviceCIDR: 10.96.0.0/12
    metallb:
      range: 192.168.122.100-192.168.122.150
    serviceIPs:
      gateway: 192.168.122.100
      tailscaleSplitDNS: 192.168.122.101
  storage:
    nfs:
      server: 192.168.122.1
      path: /mnt/k8s-storage/nfs-share
    classes:
      external: nfs-external
      local:
      - local-path
  apps:
    apiHub:
      service:
        namespace: sandbox
        name: api-hub
        type: ClusterIP
        ports:
        - 3000
  security:
    exceptions:
    - identity:
        group: ''
        kind: Service
        namespace: tailscale
        name: tailscale-split-dns
      reason: Tailnet向けSplit DNSのUDP/TCP 53。
      fields:
        type: LoadBalancer
        externalIPs: []
        externalName: ''
        loadBalancerIP: 192.168.122.101
        loadBalancerSourceRanges: []
        allocateLoadBalancerNodePorts: true
        ports:
        - name: dns-udp
          port: 53
          protocol: UDP
          targetPort: 53
        - name: dns-tcp
          port: 53
          protocol: TCP
          targetPort: 53
        selector:
          app: tailscale-split-dns
        annotations: {}
    - identity:
        group: apps
        kind: DaemonSet
        namespace: kube-system
        name: kube-network-policies
      reason: ノードのNetworkPolicyを適用するDaemonSet。
      fields:
        hostAccess:
        - path: /spec/template/spec
          hostNetwork: true
    - identity:
        group: apps
        kind: DaemonSet
        namespace: metallb-system
        name: metallb-speaker
      reason: L2広告を担当するMetalLB speaker。
      fields:
        hostAccess:
        - path: /spec/template/spec
          hostNetwork: true
    operatorResources:
    - identity:
        group: gateway.networking.k8s.io
        kind: GatewayClass
        namespace: ''
        name: nginx
      reason: NGINX Gateway controllerと設定参照。
      fields:
        controllerName: gateway.nginx.org/nginx-gateway-controller
        parametersRef:
          group: gateway.nginx.org
          kind: NginxProxy
          name: nginx-gateway-fabric-proxy-config
          namespace: nginx-gateway
      runtimeChecks:
      - 生成後のService種別・port・ownerReference、PodのhostNetwork/hostPortを確認する。
    - identity:
        group: gateway.nginx.org
        kind: NginxProxy
        namespace: nginx-gateway
        name: nginx-gateway-fabric-proxy-config
      reason: Gatewayの生成ServiceとPodの設定。
      fields:
        kubernetes:
          deployment:
            replicas: 1
            container: {}
          service:
            externalTrafficPolicy: Local
            loadBalancerIP: 192.168.122.100
            type: LoadBalancer
      runtimeChecks:
      - 生成後のService種別・port・ownerReference、PodのhostNetwork/hostPortを確認する。
    - identity:
        group: postgres-operator.crunchydata.com
        kind: PostgresCluster
        namespace: database
        name: shared-postgresql
      reason: PGO生成Service・instance・proxyの宣言。
      fields:
        instances:
        - dataVolumeClaimSpec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
            storageClassName: nfs-postgresql
          name: main
          replicas: 1
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
      runtimeChecks:
      - 生成後のService種別・port・ownerReference、PodのhostNetwork/hostPortを確認する。
    - identity:
        group: tailscale.com
        kind: Connector
        namespace: tailscale
        name: k8s-subnet-router
      reason: 既存の自宅サブネット広告。
      fields:
        hostnamePrefix: k8s-subnet-router
        replicas: 1
        subnetRouter:
          advertiseRoutes:
          - 192.168.122.0/24
        tags:
        - tag:k8s-subnet-router
      runtimeChecks:
      - 生成後のService種別・port・ownerReference、PodのhostNetwork/hostPortを確認する。
