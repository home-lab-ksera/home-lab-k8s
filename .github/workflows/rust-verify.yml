# Rust アプリリポジトリから呼ぶ共通検証 workflow（docs/app-delivery.md）。
# リポジトリの rust-toolchain.toml の版で fmt・clippy・cargo-audit を実行する。
# 1つでも指摘があれば失敗する。結果は job summary と job ログに出す。テストは各リポジトリの workflow が担当する。
# cargo-audit は脆弱性で失敗し、unsound / unmaintained の警告では失敗しない。
# ビルドに含まれない crate の指摘は、理由を添えて呼び出し側の .cargo/audit.toml で無視する。
#
# 呼び出し側の例:
#   verify:
#     uses: home-lab-ksera/home-lab-k8s/.github/workflows/rust-verify.yml@main
#     with:
#       apt_packages: pkg-config libdav1d-dev

name: Rust verify

on:
  workflow_call:
    inputs:
      working_directory:
        description: Cargo workspace のディレクトリ（リポジトリルートからの相対）
        required: false
        type: string
        default: "."
      apt_packages:
        description: clippy のビルドに必要な apt パッケージ（空白区切り）。空なら導入しない
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml がありません"; exit 1; }
          rustup toolchain install
          rustup component add rustfmt clippy
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working_directory }}

      - name: Install build dependencies
        if: inputs.apt_packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt_packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run fmt, clippy and audit
        run: |
          failed=0
          report() {
            name="$1"; shift
            if "$@" > "$RUNNER_TEMP/$name.log" 2>&1; then
              echo "- ✅ \`$name\`" >> "$GITHUB_STEP_SUMMARY"
            else
              # summary は API から読めないため、job のログにも出す。
              echo "::group::$name の出力"
              cat "$RUNNER_TEMP/$name.log"
              echo "::endgroup::"
              failed=1
              echo "::error::$name が問題を報告しました"
              {
                echo "- ⚠️ \`$name\`"
                echo
                echo '<details><summary>出力（末尾 200 行）</summary>'
                echo
                echo '```'
                tail -n 200 "$RUNNER_TEMP/$name.log"
                echo '```'
                echo
                echo '</details>'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          echo "### Rust verify（$(rustc --version)）" >> "$GITHUB_STEP_SUMMARY"
          report fmt cargo fmt --all --check
          report clippy cargo clippy --locked --all-targets -- -D warnings
          report audit cargo audit
          exit "$failed"
