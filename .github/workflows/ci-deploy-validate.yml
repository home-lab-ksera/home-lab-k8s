name: Deploy Process Validation

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

concurrency:
  group: deploy-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  platform-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install validation toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Validate Loki, Alloy and Renovate with pinned runtime images
        run: mise exec -- python3 automation/scripts/ci/validate-platform-configs.py

  setup-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test setup control flow without infrastructure access
        run: python3 -m unittest discover -s automation/tests/setup -v

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Validate deployment assets
        run: mise exec -- automation/scripts/ci/validate.sh
