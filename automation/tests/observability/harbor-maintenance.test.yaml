rule_files:
  - ../../../manifests/platform/observability/config/alert-rules.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="harbor",cronjob="harbor-maintenance"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: HarborMaintenanceStalled
        exp_alerts: []
      - eval_time: 45m
        alertname: HarborMaintenanceStalled
        exp_alerts:
          - exp_labels:
              namespace: harbor
              cronjob: harbor-maintenance
              severity: warning
            exp_annotations:
              summary: "Harbor自動保守が30分以上成功していません。Jobログと配布状態を確認してください"
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="harbor",cronjob="harbor-maintenance"}'
        values: '0+60x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: HarborMaintenanceStalled
        exp_alerts: []
  - interval: 1m
    input_series:
      # 配布中の短時間blockedは通知しない。
      - series: 'harbor_maintenance_repository_blocked{repository="blog",reason="workloadの切替完了待ち"}'
        values: '0x10 1x5 0x100'
      # 1時間以上継続したblockedはreasonが変わってもrepo単位で通知する。
      - series: 'harbor_maintenance_repository_blocked{repository="hitomi-pdf-batch",reason="実行imageIDがmanifestと不一致"}'
        values: '1x40 _x80'
      - series: 'harbor_maintenance_repository_blocked{repository="hitomi-pdf-batch",reason="workloadの切替完了待ち"}'
        values: '_x40 1x80'
    alert_rule_test:
      - eval_time: 50m
        alertname: HarborRepositoryBlocked
        exp_alerts: []
      - eval_time: 80m
        alertname: HarborRepositoryBlocked
        exp_alerts:
          - exp_labels:
              repository: hitomi-pdf-batch
              namespace: harbor
              severity: warning
            exp_annotations:
              summary: "Harbor保守で hitomi-pdf-batch が1時間以上保留されています（保持処理の対象外）。harbor-maintenance Jobログの reason を確認してください"
