rule_files:
  - ../../../manifests/platform/observability/config/alert-rules.yaml
evaluation_interval: 1m
tests:
  # 毎日成功している通常状態では通知しない。24h後に次の成功時刻へ更新される。
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="database",cronjob="postgresql-backup"}'
        values: '0x1440 86400x600'
    alert_rule_test:
      - eval_time: 33h
        alertname: PostgreSQLBackupStale
        exp_alerts: []
  # 成功が止まると26時間+30分後に通知。
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="database",cronjob="postgresql-backup"}'
        values: '0x1700'
    alert_rule_test:
      - eval_time: 26h20m
        alertname: PostgreSQLBackupStale
        exp_alerts: []
      - eval_time: 26h40m
        alertname: PostgreSQLBackupStale
        exp_alerts:
          - exp_labels:
              namespace: database
              severity: warning
              cronjob: postgresql-backup
            exp_annotations:
              summary: "共通PostgreSQLの日次バックアップが26時間以上成功していません。kubectl -n database get jobs とJobのログを確認してください"
  # メトリクス自体が無い場合も通知する。
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 31m
        alertname: PostgreSQLBackupStale
        exp_alerts:
          - exp_labels:
              namespace: database
              severity: warning
              cronjob: postgresql-backup
            exp_annotations:
              summary: "共通PostgreSQLの日次バックアップが26時間以上成功していません。kubectl -n database get jobs とJobのログを確認してください"
